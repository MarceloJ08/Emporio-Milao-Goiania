name: Enterprise smoke validation
on:
  push:
    branches: [architecture/enterprise-modular, feature/online-assistant-sales-workspace]
  pull_request:
    branches: [architecture/enterprise-modular]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate project structure and syntax
        run: node enterprise/tests/smoke.mjs
