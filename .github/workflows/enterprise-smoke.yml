name: Enterprise smoke validation
on:
  push:
    branches: [architecture/enterprise-modular]
  pull_request:
    branches: [architecture/enterprise-modular]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b1f5b7846eae5a53e5f7b4c5a7d9d8f
        with:
          node-version: '22'
      - name: Validate project structure and syntax
        run: node enterprise/tests/smoke.mjs
